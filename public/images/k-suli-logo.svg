<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <!-- Clean Isolated K-Suli Logo Vector with 100% Transparent Background -->
  <g id="k-suli-logo">
    <!-- Top cursive text "K-suli" -->
    <path d="M 160 85 C 165 72 178 68 190 70 C 185 78 180 88 175 102 C 172 110 168 118 163 125 C 161 122 165 105 168 95 Z" fill="#111827"/>
    <path d="M 172 96 C 185 90 202 85 210 95 C 205 102 195 106 182 108 C 192 118 206 126 215 128 C 210 131 198 126 186 117 C 180 125 174 133 168 135 C 170 128 174 116 177 106 Z" fill="#111827"/>
    <path d="M 215 108 Q 225 107 232 108 Q 230 112 220 112 Z" fill="#111827"/>
    <text x="250" y="112" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-size="44" font-weight="bold" font-style="italic" fill="#111827" text-anchor="middle">K-suli</text>
    <path d="M 175 118 Q 240 136 320 115 Q 260 126 195 122 Z" fill="#111827"/>

    <!-- Hand Main Shapes -->
    <!-- Pink Little Finger (Leftmost) -->
    <path d="M 162 278 C 148 290 142 315 152 335 C 165 362 192 376 218 368 C 228 365 220 340 212 328 C 196 304 180 280 162 278 Z" fill="#E91E63" stroke="#111827" stroke-width="8" stroke-linejoin="round"/>

    <!-- Brown Ring Finger -->
    <path d="M 185 240 C 172 250 166 270 174 292 C 185 320 205 342 228 340 C 248 338 252 315 246 295 C 238 270 220 242 198 238 C 192 237 188 238 185 240 Z" fill="#A0522D" stroke="#111827" stroke-width="8" stroke-linejoin="round"/>

    <!-- Yellow Middle Finger (Peace Sign Left) -->
    <path d="M 178 165 C 168 185 182 225 198 260 C 215 295 235 325 258 315 C 272 308 268 280 256 250 C 238 205 212 142 196 140 C 185 138 180 148 178 165 Z" fill="#FFEB3B" stroke="#111827" stroke-width="8" stroke-linejoin="round"/>

    <!-- Yellow Index Finger (Peace Sign Right) -->
    <path d="M 252 140 C 242 150 248 185 255 225 C 262 260 270 292 288 290 C 302 288 308 265 304 235 C 298 185 285 135 272 132 C 260 130 254 134 252 140 Z" fill="#FFEB3B" stroke="#111827" stroke-width="8" stroke-linejoin="round"/>

    <!-- Cyan Palm & Thumb Folded -->
    <path d="M 245 225 C 232 238 240 265 258 285 C 282 310 325 330 335 300 C 342 278 325 250 300 238 C 275 225 255 218 245 225 Z" fill="#00BCD4" stroke="#111827" stroke-width="8" stroke-linejoin="round"/>

    <path d="M 188 350 C 210 388 255 402 298 392 C 342 382 375 348 372 302 C 370 265 345 240 318 238 C 300 238 290 250 282 268 C 270 295 252 320 228 335 C 208 348 192 345 188 350 Z" fill="#00BCD4" stroke="#111827" stroke-width="8" stroke-linejoin="round"/>

    <!-- Illustrations inside Palm: Coffee Cup & Cold Milk Iced Glass -->
    <!-- Hot Coffee Cup -->
    <ellipse cx="265" cy="370" rx="18" ry="6" fill="none" stroke="#111827" stroke-width="3"/>
    <path d="M 250 355 C 250 372 280 372 280 355 Z" fill="#111827"/>
    <path d="M 280 358 C 287 358 287 368 280 368" fill="none" stroke="#111827" stroke-width="2.5"/>
    <path d="M 258 348 Q 262 342 260 338" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    <path d="M 268 348 Q 272 342 270 338" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round"/>

    <!-- Cold Milk Mug with Ice & Straw -->
    <rect x="300" y="318" width="22" height="32" rx="4" fill="none" stroke="#111827" stroke-width="3"/>
    <path d="M 322 324 C 330 324 330 338 322 338" fill="none" stroke="#111827" stroke-width="2.5"/>
    <!-- Straw -->
    <path d="M 306 310 L 302 302" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <!-- Ice cubes inside -->
    <rect x="305" y="325" width="5" height="5" fill="none" stroke="#111827" stroke-width="1.5"/>
    <rect x="312" y="333" width="5" height="5" fill="none" stroke="#111827" stroke-width="1.5"/>

    <!-- Bottom Sign Language Hand Fingerspelling: K-S-U-L-I -->
    <g transform="translate(130, 420)" stroke="#111827" stroke-width="3" fill="#ffffff" stroke-linejoin="round" stroke-linecap="round">
      <!-- K -->
      <g transform="translate(0, 0) scale(0.65)">
        <path d="M 15 45 L 15 25 C 15 20 22 20 22 25 L 22 45 Z" fill="#fff"/>
        <path d="M 22 25 L 28 8 C 30 5 35 7 34 12 L 28 25" fill="#fff"/>
        <path d="M 28 25 L 38 12 C 41 9 46 12 43 17 L 34 32" fill="#fff"/>
        <path d="M 12 35 C 5 38 8 50 18 50 L 35 50 C 42 50 42 35 35 35 Z" fill="#fff"/>
      </g>
      <!-- S -->
      <g transform="translate(50, 0) scale(0.65)">
        <rect x="8" y="15" width="28" height="32" rx="10" fill="#fff"/>
        <path d="M 8 26 Q 22 24 32 32" fill="none"/>
        <path d="M 12 20 Q 20 28 14 36" fill="#fff"/>
      </g>
      <!-- U -->
      <g transform="translate(100, 0) scale(0.65)">
        <path d="M 16 10 L 16 35 C 16 45 32 45 32 35 L 32 10 C 32 5 24 5 24 10 L 24 30 L 24 10 C 24 5 16 5 16 10 Z" fill="#fff"/>
        <rect x="10" y="30" width="28" height="18" rx="6" fill="#fff"/>
      </g>
      <!-- L -->
      <g transform="translate(150, 0) scale(0.65)">
        <path d="M 14 5 L 14 36 C 14 42 20 44 26 44 L 40 44 C 44 44 44 38 40 38 L 22 38 L 22 5 C 22 1 14 1 14 5 Z" fill="#fff"/>
        <rect x="16" y="25" width="18" height="18" rx="5" fill="#fff"/>
      </g>
      <!-- I -->
      <g transform="translate(200, 0) scale(0.65)">
        <path d="M 32 8 L 32 36 C 32 42 26 42 22 42 L 12 42 C 8 42 8 36 12 36 L 24 36 L 24 24" fill="#fff"/>
        <rect x="10" y="20" width="22" height="24" rx="7" fill="#fff"/>
        <path d="M 32 8 C 32 4 38 4 38 8 L 38 32 C 38 36 32 36 32 32 Z" fill="#fff"/>
      </g>
    </g>
  </g>
</svg>
